plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Cada repositorio solo sirve los grupos que le corresponden (evita descargas ambiguas)
    exclusiveContent {
        forRepository { maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup 'vazkii.patchouli' }
    }
    exclusiveContent {
        forRepository { maven { name = 'FTB'; url = 'https://maven.ftb.dev/releases' } }
        filter { includeGroup 'dev.ftb.mods' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' } }
        filter { includeGroup 'dev.architectury' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.latvian' }
    }
    exclusiveContent {
        forRepository { maven { name = 'JitPack'; url = 'https://jitpack.io' } }
        filter { includeGroup 'com.github.rtyley' }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Ejecuciones de prueba por integración. Cada una tiene su carpeta y su espacio de nombres de pruebas.
        // Motivo: mods como FTB Quests o KubeJS envían paquetes de sincronización al "iniciar sesión" y los jugadores
        // simulados de GameTest no pueden recibirlos; por eso las pruebas con jugadores se ejecutan sin ellos.
        gameTestFtbQuests {
            type = "gameTestServer"
            gameDirectory = file('run-ftb')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id + '_ftb'
        }
        gameTestKubeJs {
            type = "gameTestServer"
            gameDirectory = file('run-kubejs')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id + '_kubejs'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Dependencia obligatoria: animación y render de modelos (MIT). Verificado: 4.9.3 publicado para 1.21.1 NeoForge.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // --- Integraciones OPCIONALES. Solo en el entorno de desarrollo (localRuntime): el mod NO las enlaza en código.
    // Patchouli: libro de guía definido solo con datos (JSON). Solo desarrollo; el mod no enlaza ninguna clase suya.
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"

    // FTB Quests (cadena completa) y KubeJS: solo cuando se pide con -PwithFtbQuests / -PwithKubeJs.
    // Las misiones y los scripts son DATOS nuestros; ninguna clase de estos mods se enlaza en el código.
    if (project.hasProperty('withFtbQuests')) {
        localRuntime "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    }
    if (project.hasProperty('withKubeJs')) {
        localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    }

    // --- Pruebas unitarias del núcleo (Java puro, sin Minecraft)
    testImplementation platform("org.junit:junit-bom:5.10.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "failed", "skipped"; showStandardStreams = false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// --- Datos de integración para las ejecuciones de desarrollo (son DATOS nuestros, no código)
tasks.register('installDevQuests', Copy) {
    from 'integrations/ftbquests/quests'
    into layout.projectDirectory.dir('run-ftb/config/ftbquests/quests')
}
tasks.register('installDevKubeJs', Copy) {
    from 'integrations/kubejs'
    into layout.projectDirectory.dir('run-kubejs/kubejs')
}
tasks.matching { it.name == 'runGameTestFtbQuests' }.configureEach { dependsOn 'installDevQuests' }
tasks.matching { it.name == 'runGameTestKubeJs' }.configureEach { dependsOn 'installDevKubeJs' }
